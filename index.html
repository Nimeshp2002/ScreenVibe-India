<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenVibe India - Movie Reviews, News & Trailers</title>
<meta name="description" content="Bollywood, Hollywood aur South films ke reviews, trailers, cast aur box office. Kahan legally dekhein, sab ek jagah.">
<style>
:root{--bg:#0b0b10;--card:#16161f;--red:#e50914;--gold:#ffc83d;--mut:#9a9aab}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:22px 15px 16px;text-align:center;background:linear-gradient(180deg,#2a0a10 0%,var(--bg) 100%)}
header h1{margin:0;font-size:28px;letter-spacing:.5px;color:var(--red);font-weight:800}
header p{margin:6px 0 0;font-size:12px;color:var(--mut)}
.top{position:sticky;top:0;z-index:5;background:rgba(11,11,16,.94);backdrop-filter:blur(8px);padding-bottom:8px}
.search{display:flex;gap:8px;padding:10px 12px;max-width:900px;margin:auto}
.search input{flex:1;min-width:0;padding:12px 14px;border-radius:24px;border:1px solid #2a2a38;background:#16161f;color:#fff;font-size:15px;outline:none}
.search input:focus{border-color:var(--red)}
.search button{background:var(--red);color:#fff;border:0;padding:0 20px;border-radius:24px;font-size:14px;font-weight:700}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 12px;max-width:900px;margin:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;background:#1d1d29;color:#ddd;border:0;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600}
nav button.active{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:14px 12px;max-width:900px;margin:auto}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.c{background:var(--card);border-radius:12px;overflow:hidden;position:relative;cursor:pointer;transition:transform .2s;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.c:active{transform:scale(.97)}
.c img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;background:#222}
.c p{margin:0;padding:10px;font-size:13px;line-height:1.3}
.c small{color:var(--mut)}
.r{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);color:var(--gold);font-size:12px;padding:3px 8px;border-radius:12px;font-weight:700}
.msg{grid-column:1/-1;text-align:center;color:#ccc;padding:30px 10px}
#more{display:block;margin:10px auto 24px;background:#1d1d29;color:#fff;border:0;padding:11px 28px;border-radius:22px;font-size:14px;font-weight:600}
#modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);overflow:auto;z-index:20}
#modal.show{display:block}
.x{position:fixed;top:14px;right:14px;background:rgba(0,0,0,.7);color:#fff;border:1px solid #444;border-radius:50%;width:38px;height:38px;font-size:16px;z-index:30}
.box{max-width:720px;margin:0 auto;background:var(--card);min-height:100%;padding-bottom:20px}
@media(min-width:760px){.box{margin:20px auto;border-radius:14px;overflow:hidden;min-height:0}}
.hero{position:relative}
.hero img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.hg{position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(0deg,var(--card),transparent)}
.hero h2{position:absolute;left:15px;right:15px;bottom:8px;margin:0;font-size:22px;color:#fff;text-shadow:0 2px 8px #000}
.in{padding:0 15px}
.in>h2{margin:18px 0 6px;font-size:22px}
.tags{margin:8px 0}
.tag{display:inline-block;background:#262636;padding:4px 10px;font-size:12px;border-radius:14px;margin:0 6px 6px 0;color:#eee}
.tag.hot{background:var(--red);font-weight:700}
.box h3{font-size:15px;margin:20px 0 8px;color:var(--gold);letter-spacing:.3px}
.box p{font-size:14px;line-height:1.7;color:#d6d6e0;margin:6px 0}
.cast{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.cast::-webkit-scrollbar{display:none}
.p{flex:0 0 78px;text-align:center}
.p img,.p .ph{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#2a2a38;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto;border:2px solid #2f2f42}
.p b{display:block;font-size:12px;margin-top:6px;line-height:1.3}
.p small{display:block;font-size:11px;color:var(--mut);line-height:1.3;margin-top:2px}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:#1f1f2c;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:16px;color:#fff}
.stat small{color:var(--mut);font-size:11px}
.video{position:relative;padding-bottom:56.25%;height:0;margin:8px 0}
.video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:10px}
.ott{display:block;background:#1fa34a;color:#fff;text-align:center;padding:12px;text-decoration:none;border-radius:10px;font-weight:700;margin-top:10px}
.mine{background:#232334;border-left:3px solid var(--red);padding:10px 12px;border-radius:6px}
footer{text-align:center;color:#666;font-size:11px;padding:20px 15px 30px}
</style>
</head>
<body>
<header><h1>ScreenVibe India</h1><p>Movie Reviews, News & Official Trailers</p></header>
<div class="top">
<div class="search">
<input id="q" placeholder="Film ka naam search karo...">
<button id="go">Search</button>
</div>
<nav id="tabs">
<button class="active" data-t="trending">Trending</button>
<button data-t="now">Now Playing</button>
<button data-t="upcoming">Upcoming</button>
<button data-t="top">Top Rated</button>
<button data-t="reviews">Our Reviews</button>
</nav>
</div>
<div class="grid" id="grid"></div>
<button id="more">Aur dikhao</button>
<div id="modal"><div class="box" id="box"></div></div>
<footer>© ScreenVibe India. Movie data aur images TMDB se. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
<script src="main.js"></script>
</body>
</html>
