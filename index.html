<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>ScreenVibe India - Movie Reviews, News & Trailers</title>
<meta name="description" content="Bollywood, Hollywood aur South films ke reviews, trailers, cast aur box office. Kahan legally dekhein, sab ek jagah.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#14141d;--card2:#1c1c28;--red:#e50914;--red2:#ff3d4a;--gold:#ffc83d;--mut:#9494a8;--line:#272736}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#fff;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

header{position:relative;padding:30px 15px 22px;text-align:center;overflow:hidden;background:radial-gradient(ellipse at 50% -20%,rgba(229,9,20,.55),transparent 65%),linear-gradient(180deg,#1a0508 0%,var(--bg) 100%)}
header::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.025) 38px 40px);pointer-events:none}
header h1{position:relative;margin:0;font-size:30px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#fff,#ff5560 60%,#e50914);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header h1 span{-webkit-text-fill-color:initial;margin-right:6px}
header p{position:relative;margin:8px 0 0;font-size:12px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase}

.top{position:sticky;top:0;z-index:5;background:rgba(10,10,15,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:10px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px;padding:12px 12px 10px;max-width:900px;margin:auto}
.search input{flex:1;min-width:0;padding:13px 18px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:#fff;font:500 14px Poppins,sans-serif;outline:none;transition:.2s}
.search input::placeholder{color:#6d6d82}
.search input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,9,20,.2)}
.search button{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:0;padding:0 22px;border-radius:30px;font:600 14px Poppins,sans-serif;box-shadow:0 4px 14px rgba(229,9,20,.4)}
.search button:active{transform:scale(.95)}

nav{display:flex;gap:8px;overflow-x:auto;padding:0 12px;max-width:900px;margin:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;background:var(--card);color:#bbb;border:1px solid var(--line);padding:8px 16px;border-radius:20px;font:500 13px Poppins,sans-serif;transition:.2s}
nav button.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:transparent;font-weight:600;box-shadow:0 4px 12px rgba(229,9,20,.4)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 12px;max-width:900px;margin:auto}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
.c{position:relative;background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .5s both}
.c:hover{transform:translateY(-5px);border-color:rgba(229,9,20,.6);box-shadow:0 12px 28px rgba(229,9,20,.25)}
.c:active{transform:scale(.97)}
.c img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;background:linear-gradient(110deg,#1b1b27 30%,#262636 50%,#1b1b27 70%);background-size:200% 100%;animation:sh 1.4s infinite;transition:transform .4s}
.c:hover img{transform:scale(1.06)}
.c::after{content:"";position:absolute;left:0;right:0;top:0;aspect-ratio:2/3;background:linear-gradient(0deg,rgba(20,20,29,.9) 0%,transparent 35%);pointer-events:none}
.c p{margin:0;padding:10px 11px 12px;font-size:13px;line-height:1.35;font-weight:600}
.c small{color:var(--mut);font-weight:400;font-size:11px}
.r{position:absolute;z-index:2;top:9px;left:9px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);color:var(--gold);font-size:12px;padding:4px 9px;border-radius:14px;font-weight:700;border:1px solid rgba(255,200,61,.3)}
.msg{grid-column:1/-1;text-align:center;color:#bbb;padding:40px 14px;line-height:1.7;font-size:14px}
@keyframes sh{to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

#more{display:block;margin:6px auto 28px;background:var(--card);color:#fff;border:1px solid var(--red);padding:12px 32px;border-radius:30px;font:600 14px Poppins,sans-serif;transition:.2s}
#more:active{background:var(--red);transform:scale(.96)}

#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);overflow:auto;z-index:20;-webkit-overflow-scrolling:touch}
#modal.show{display:block}
.x{position:fixed;top:14px;right:14px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);color:#fff;border:1px solid #555;border-radius:50%;width:40px;height:40px;font-size:16px;z-index:30}
.box{max-width:720px;margin:0 auto;background:var(--card);min-height:100%;padding-bottom:26px;animation:slide .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:760px){.box{margin:24px auto;border-radius:18px;overflow:hidden;min-height:0;border:1px solid var(--line)}}
.hero{position:relative}
.hero img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.hg{position:absolute;left:0;right:0;bottom:0;height:80%;background:linear-gradient(0deg,var(--card) 5%,transparent)}
.hero h2{position:absolute;left:16px;right:16px;bottom:10px;margin:0;font-size:24px;font-weight:800;line-height:1.2;text-shadow:0 2px 12px #000}
.in{padding:0 16px}
.in>h2{margin:20px 0 6px;font-size:24px;font-weight:800}
.tags{margin:10px 0 6px}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--line);padding:5px 12px;font-size:12px;border-radius:16px;margin:0 6px 7px 0;color:#e5e5ef}
.tag.hot{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent;font-weight:700}
.box h3{display:flex;align-items:center;gap:8px;font-size:13px;margin:24px 0 10px;color:var(--gold);letter-spacing:1.2px;font-weight:700}
.box h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--red)}
.box p{font-size:14px;line-height:1.75;color:#cfcfdb;margin:6px 0}
.cast{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.cast::-webkit-scrollbar{display:none}
.p{flex:0 0 82px;text-align:center}
.p img,.p .ph{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;margin:0 auto;border:2px solid var(--red);padding:2px}
.p b{display:block;font-size:12px;margin-top:8px;line-height:1.3;font-weight:600}
.p small{display:block;font-size:10.5px;color:var(--mut);line-height:1.3;margin-top:3px}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:linear-gradient(145deg,var(--card2),#10101a);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:17px;color:var(--gold)}
.stat small{color:var(--mut);font-size:11px;letter-spacing:.5px}
.video{position:relative;padding-bottom:56.25%;height:0;margin:8px 0;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.ott{display:block;background:linear-gradient(135deg,#1fa34a,#2ecc71);color:#fff;text-align:center;padding:14px;text-decoration:none;border-radius:14px;font-weight:700;margin-top:12px;box-shadow:0 6px 18px rgba(31,163,74,.35)}
.mine{background:linear-gradient(135deg,#25182a,#1d1d2c);border:1px solid var(--line);border-left:4px solid var(--red);padding:12px 14px;border-radius:10px}

#up{position:fixed;right:14px;bottom:18px;width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-size:18px;box-shadow:0 6px 16px rgba(229,9,20,.5);opacity:0;pointer-events:none;transition:.25s;z-index:6}
#up.on{opacity:1;pointer-events:auto}
footer{text-align:center;color:#6a6a7e;font-size:11px;line-height:1.7;padding:24px 18px 36px;border-top:1px solid var(--line);margin-top:10px}
</style>
</head>
<body>
<header><h1><span>🎬</span>ScreenVibe India</h1><p>Reviews · News · Trailers</p></header>
<div class="top">
<div class="search">
<input id="q" placeholder="🔍  Film ka naam search karo...">
<button id="go">Search</button>
</div>
<nav id="tabs">
<button class="active" data-t="trending">🔥 Trending</button>
<button data-t="now">🎟️ Now Playing</button>
<button data-t="upcoming">⏳ Upcoming</button>
<button data-t="top">🏆 Top Rated</button>
<button data-t="reviews">✍️ Our Reviews</button>
</nav>
</div>
<div class="grid" id="grid"></div>
<button id="more">Aur dikhao</button>
<div id="modal"><div class="box" id="box"></div></div>
<button id="up" aria-label="Upar jao">↑</button>
<footer>© ScreenVibe India<br>Movie data aur images TMDB se. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
<script src="main.js"></script>
<script>
var up=document.getElementById("up");
window.addEventListener("scroll",function(){up.classList.toggle("on",window.scrollY>600)});
up.onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
</script>
  <script>
window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
