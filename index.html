<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenVibe India - Movie Reviews, News & Trailers</title>
<style>
body{margin:0;background:#0f0f12;color:#fff;font-family:Arial,sans-serif}
header{background:#1a1a24;padding:15px;text-align:center;border-bottom:2px solid #e50914}
header h1{margin:0;color:#e50914;font-size:24px}
header p{margin:5px 0 0;font-size:12px;color:#aaa}
nav{display:flex;gap:8px;justify-content:center;padding:12px;background:#15151d;position:sticky;top:0}
nav button{background:#2a2a38;color:#fff;border:0;padding:8px 16px;border-radius:20px;font-size:14px}
nav button.active{background:#e50914}
.container{max-width:800px;margin:auto;padding:15px}
.card{background:#1a1a24;border-radius:8px;padding:15px;margin-bottom:20px}
.card h2{color:#ffcc00;font-size:18px;margin:0 0 8px}
.badge{display:inline-block;background:#e50914;padding:3px 8px;font-size:11px;border-radius:4px;font-weight:bold;margin-right:5px}
.story{font-size:14px;line-height:1.6;color:#ddd}
.video{position:relative;padding-bottom:56.25%;height:0;margin:10px 0}
.video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:6px}
.ott{display:block;background:#28a745;color:#fff;text-align:center;padding:10px;text-decoration:none;border-radius:5px;font-weight:bold;margin-top:10px}
footer{text-align:center;color:#777;font-size:12px;padding:20px}
</style>
</head>
<body>
<header><h1>ScreenVibe India</h1><p>Movie Reviews, News & Official Trailers</p></header>
<nav>
<button class="active" data-t="all">All</button>
<button data-t="review">Reviews</button>
<button data-t="news">News</button>
<button data-t="trailer">Trailers</button>
</nav>
<div class="container" id="list"></div>
<footer>© ScreenVibe India</footer>
<script src="main.js"></script>
</body>
</html>
